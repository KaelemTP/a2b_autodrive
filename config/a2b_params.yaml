# a2b_planner parameters. Topics and messages match the Pnc slot of the WorldSim simulation.
a2b_planner:
  ros__parameters:
    localization_topic: /localization/localization_data   # robominer_msgs/LocalizationData
    plan_target_topic: /guardian/plan_target              # robominer_msgs/PlanTarget (point B)
    task_state_topic: /guardian/task_state                # robominer_msgs/TaskState (start/stop)
    control_topic: /auto/control_cmd                      # robominer_msgs/ControlCmd
    control_debug_topic: /auto/control_debug              # robominer_msgs/ControlDebug (Simmoulde needs it)
    publish_pwm: true            # also /pwm_duty for the real truck's Modbus driver
    rate_hz: 20.0
    map_frame: world
    auto_start: false

    # Fallback B if no plan_target arrives. With goal_relative: metres ahead (x) / left (y) of start.
    goal_x: 10.0
    goal_y: 0.0
    goal_relative: true
    waypoints: [0.0]             # e.g. [6.0, 0.0]; [0.0] = none

    # ControlCmd mapping for the simulation
    sim_max_steer_deg: 30.0      # target_steering (deg, left +) at full lock; ControlCmd allows +-50
    stop_brake_pct: 60.0         # target_brake while stopping / stopped
    accel_gain: 1.0              # total_accel_cmd = gain * (v_ref - v), for driver_mode=1
    max_accel: 1.0               # m/s^2
    max_decel: 1.5               # m/s^2 when stopping

    # Truck (measure on the real truck)
    wheelbase: 0.30
    max_steer_deg: 30.0
    steer_sign: -1.0             # <7.5 % = left on this truck

    # Speed / control
    cruise_speed: 0.6
    min_speed: 0.25
    drive_forward_min: 7.9
    drive_forward_max: 8.6
    brake_duty: 6.0
    brake_time: 0.6

    # Safety
    goal_tolerance: 0.30
    loc_timeout: 0.5

    # Obstacle stop (used when a launch sets obstacle_cloud_topic, e.g. the lidar launches).
    # Distances are measured from the rear axle along the driving corridor.
    obstacle_slow_dist: 2.5      # m, start slowing down
    obstacle_stop_dist: 1.0      # m, stop and wait (state BLOCKED)
    obstacle_clear_margin: 0.3   # m, drive on once the path is clear beyond stop_dist + margin
    obstacle_resume: true        # false = stop for good instead of waiting
    corridor_half_width: 0.35    # m, half the truck width plus a margin
    obstacle_z_min: -0.3         # m in the lidar frame (floor removed by ground_filter)
    obstacle_z_max: 1.5

    # Obstacle avoidance (lidar setups). Steers around obstacles instead of only stopping.
    avoid_enable: true           # false = only stop and wait (v0.3 behaviour)
    avoid_max_offset: 2.0        # m, furthest sideways a detour may go from the route
    avoid_check_dist: 5.0        # m of path ahead that must be free
    avoid_ramp: 2.0              # m of forward travel to move sideways onto a detour
    avoid_clearance: 0.20        # m extra gap preferred beyond corridor_half_width
    avoid_speed: 0.4             # m/s while on a detour
    avoid_stop_dist: 0.4         # m of driving left before getting too close: stop (BLOCKED)
    avoid_slow_dist: 1.5         # m, start slowing before that
    body_front: 0.45             # m, truck front ahead of the rear axle (measure!)
    body_half_width: 0.20        # m, half the truck width (measure!)

    # Back up when boxed in. OFF for the real truck until the ESC's reverse PWM is measured
    # (the lidar sim launch turns it on with reverse:=true).
    reverse_enable: false
    reverse_duty: 7.0            # % PWM3 for slow reverse - NOT measured on the real ESC yet
    reverse_dist: 0.6            # m per back-up
    reverse_after: 0.8           # s BLOCKED with no way forward before backing up
    reverse_neutral_time: 0.2    # s at 7.5 % between brake and reverse
